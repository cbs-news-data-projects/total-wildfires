name: run-scraper

on:
  push:
    branches:
      - main
  schedule:
  cron: "30 15 * * *" # Runs once a day at 3:30 PM UTC, which is 7:30 AM PST
  workflow_dispatch:

jobs:
  run-poultry-script:
    runs-on: ubuntu-latest
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest 
            any::dplyr

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run script
        run: Rscript -e 'source("1-scrape.R")'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add 1-scrape.R
          git commit -m 'ran 1-scrape.R' || echo "No changes to commit"
          git push origin || echo "No changes to commit"